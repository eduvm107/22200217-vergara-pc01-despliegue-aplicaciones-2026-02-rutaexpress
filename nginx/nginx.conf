# --- Control de solicitudes -------------------------------------------------
# Solo POST /envios consume la cuota: para otros métodos la clave queda vacía
# y Nginx no la contabiliza.
map $request_method $limite_envios_clave {
  POST    $binary_remote_addr;
  default "";
}

# 2 solicitudes por segundo por IP.
limit_req_zone $limite_envios_clave zone=envios_limit:10m rate=2r/s;

# --- Registro --------------------------------------------------------------
# JSON por línea. No incluye cuerpo ni cabeceras sensibles (sin datos personales).
log_format rutaexpress_json escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"msec":"$msec",'
    '"request_id":"$request_id",'
    '"ip_cliente":"$remote_addr",'
    '"metodo":"$request_method",'
    '"ruta":"$uri",'
    '"status":"$status",'
    '"limite":"$limit_req_status",'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"tiempo_s":"$request_time",'
    '"idempotency_key":"$http_idempotency_key"'
  '}';

map $status $es_rechazo_429 {
  429     1;
  default 0;
}

# DNS interno de Docker: permite volver a encontrar una réplica que se detuvo y regresó.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend_app {
  zone backend_app 64k;
  server app1:3000 resolve max_fails=1 fail_timeout=5s;
  server app2:3000 resolve max_fails=1 fail_timeout=5s;
  server app3:3000 resolve max_fails=1 fail_timeout=5s;
  keepalive 8;
}

server {
  listen 80;

  access_log /var/log/nginx/rutaexpress/acceso.jsonl rutaexpress_json;
  access_log /var/log/nginx/rutaexpress/rechazos_429.jsonl rutaexpress_json if=$es_rechazo_429;
  error_log  /var/log/nginx/rutaexpress/error.log warn;

  proxy_http_version 1.1;
  proxy_set_header   Connection "";
  proxy_set_header   Host $host;
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $remote_addr;
  proxy_set_header   X-Request-ID $request_id;
  proxy_connect_timeout 2s;
  proxy_read_timeout    30s;

  location = /envios {
    # Ráfaga adicional de 4 atendida de inmediato (nodelay); el exceso recibe 429.
    limit_req          zone=envios_limit burst=4 nodelay;
    limit_req_status   429;
    limit_req_log_level warn;
    proxy_pass         http://backend_app;
  }

  location / {
    proxy_pass         http://backend_app;
  }

  # Respuesta del 429 en JSON; la genera Nginx, la solicitud no llega a la aplicación.
  error_page 429 = @demasiadas_solicitudes;
  location @demasiadas_solicitudes {
    default_type application/json;
    add_header X-Request-ID $request_id always;
    add_header Retry-After 1 always;
    return 429 '{"error":{"codigo":"DEMASIADAS_SOLICITUDES","mensaje":"Se superó el límite de solicitudes; intente nuevamente en unos segundos","request_id":"$request_id"}}';
  }
}
