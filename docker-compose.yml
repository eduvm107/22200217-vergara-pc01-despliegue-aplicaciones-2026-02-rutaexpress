name: envios-app

# Configuración común de las tres réplicas: misma imagen, misma base,
# solo cambia INSTANCE_ID. El puerto 3000 no se publica al host.
x-app: &app
  image: ${DOCKERHUB_USER:-eduardo30458}/envios-app:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  expose:
    - "3000"
  depends_on:
    db:
      condition: service_healthy

x-app-env: &app-env
  TZ: America/Lima
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:?Copie .env.example como .env}
  DB_PASSWORD: ${DB_PASSWORD:?Copie .env.example como .env}
  DB_NAME: ${DB_NAME:?Copie .env.example como .env}
  PERMITIR_SIMULACION: ${PERMITIR_SIMULACION:-false}

services:
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Fechas en hora de Lima para leer la evidencia (se almacenan como TIMESTAMPTZ).
    command: ["postgres", "-c", "timezone=America/Lima", "-c", "log_timezone=America/Lima"]
    environment:
      TZ: America/Lima
      POSTGRES_USER: ${DB_USER:?Copie .env.example como .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copie .env.example como .env}
      POSTGRES_DB: ${DB_NAME:?Copie .env.example como .env}
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: America/Lima
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Logs de acceso y de rechazos 429 en el host: sobreviven a recrear nginx.
      - ./logs/nginx:/var/log/nginx/rutaexpress
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy

volumes:
  db_data:
